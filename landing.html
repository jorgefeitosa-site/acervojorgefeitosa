                      </p>

                    WebkitOverflowScrolling: 'touch',
                  }}
                >
                  <div
                    style={{
                      display: 'grid',
                      gridTemplateRows: 'repeat(4, 1fr)',
                      gridAutoFlow: 'column',
                      gridAutoColumns: '180px',

                    {pieces.map((piece, idx) => (

                          display: '-webkit-box',
                          WebkitLineClamp: 2,
                          WebkitBoxOrient: 'vertical',
                          overflow: 'hidden',
                        }}>{piece.title}</p>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </section>
          );
        };

        const Curator = () => (

            <div className="max-w-7xl mx-auto px-6 grid md:grid-cols-2 gap-12 items-center">
              <div className="space-y-8">
                <h2 className="font-serif text-5xl md:text-7xl leading-[0.8]">Jorge <br /><span className="italic font-normal">Feitosa</span></h2>

              </div>
              <div className="p-12 border border-stone-200 bg-white space-y-8">
                <p className="text-[10px] uppercase tracking-[0.4em] text-black font-bold">Localização</p>
                <div className="grid grid-cols-2 gap-8">
                  <div>
                    <p className="font-serif text-2xl italic">Mata Lab</p>
                    <p className="text-[8px] uppercase tracking-widest text-stone-400">Exposição & Comercialização</p>
                  </div>
                  <div>
                    <p className="font-serif text-2xl italic">Brasil</p>
                    <p className="text-[8px] uppercase tracking-widest text-stone-400">Base</p>
                  </div>
                </div>
              </div>
            </div>
          </section>
        );

        const App = () => (
          <div className="min-h-screen bg-stone-50">
            <Navbar />
            <main><Hero /><Biography /><Gallery /><Curator /></main>
            <footer className="py-20 text-center border-t border-stone-100">
               <h2 className="font-serif text-2xl uppercase tracking-widest">Acervo Jorge Feitosa</h2>
               <div className="mt-8 flex justify-center flex-wrap gap-12 text-[10px] uppercase tracking-[0.3em] font-bold">
                  <a href="https://www.instagram.com/acervo.jorgefeitosa/" target="_blank">Instagram</a>
                  <a href="https://www.tiktok.com/@acervo.jorgefeitosa" target="_blank">TikTok</a>
                  <a href="https://wa.me/5511999904324" target="_blank">WhatsApp</a>
               </div>
            </footer>
          </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
